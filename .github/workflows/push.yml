name: Push
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Wyślij powiadomienie testowe teraz (1 = tak)'
        default: '0'
concurrency:
  group: push
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Instalacja
        working-directory: srv
        run: npm install --no-audit --no-fund --loglevel=error
      - name: Wysyłka
        working-directory: srv
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SA }}
          TEST: ${{ inputs.test }}
        run: node send.mjs
