html,body{margin:0;background:#07080B;color:#F3F2EF}
#mq-lock{--acc:#E8B86A;--fg:#F3F2EF;--fg2:#A3A7AE;--fg3:#6F747D;--line:rgba(255,255,255,.1);--bad:#FF8A80;--ok:#8BE3B2;
  min-height:100vh;min-height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;

.lk{width:100%;max-width:380px;display:flex;flex-direction:column;gap:18px;text-align:center}

  font:600 18px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;text-align:center;text-transform:uppercase;padding:0 12px;outline:none}

<script>window.__fbP=new Promise(function(r){window.__fbR=r});window.__fbL=function(){if(window.__fbS)return;window.__fbS=1;var s=document.createElement("script");s.src="fb.js";s.async=true;s.onload=function(){window.__fbR(1)};s.onerror=function(){window.__fbR(0)};document.head.appendChild(s)}</script>
<script>
(function(){
const VER='f70df4c5c408';
const $=s=>document.querySelector(s);
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}};
const ALPH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
function newCode(){const b=rnd(20);let s='';for(let i=0;i<20;i++){s+=ALPH[b[i]&31];if(i%4===3&&i<19)s+='-'}return s}
const normCode=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const prettyCode=c=>normCode(c).replace(/(.{4})(?=.)/g,'$1-');
const newPid=()=>'p'+[...rnd(10)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function hash(code){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('mq1:'+normCode(code)));return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const b64d=s=>{s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isIOS=()=>/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=()=>navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
const inApp=()=>/FBAN|FBAV|Instagram|Messenger|Snapchat|TikTok|Line\//i.test(navigator.userAgent);
async function copy(t){try{await navigator.clipboard.writeText(t);return true}catch(e){return false}}
window.MQL={newCode,normCode,prettyCode,newPid,hash,copy,isIOS,isStandalone,ver:VER};
// fb.js (Firebase) wczytuję dopiero, gdy jest potrzebny: na ekranie kodu od razu, w apce przy pierwszym użyciu chmury.
// Wcześniej wykonywał się przy każdym starcie przed apką i blokował pierwszy obraz
async function fbWait(){if(window.__fbL)window.__fbL();await window.__fbP;if(!window.MQFB){const x=new Error('net');x.net=true;throw x}}
// fonty z pierwszego ekranu biorę z pamięci telefonu od razu, równolegle z odszyfrowaniem apki: pierwszy obraz ma już właściwe litery
function warmFonts(){try{if(!navigator.serviceWorker||!navigator.serviceWorker.controller||!document.fonts)return;const F=document.fonts;
  ['700','800','900'].forEach(w=>F.load(w+' 16px Nunito','aą').catch(()=>{}));F.load('italic 500 16px Newsreader','aą').catch(()=>{})}catch(e){}}
// nowa wersja: service worker pobiera ją w tle przy wejściu, a potem przejmuje stronę. Daję znać, gdy apka już działa
const HAD_SW=!!(navigator.serviceWorker&&navigator.serviceWorker.controller);
function updToast(){if(!window.__mqUpd||window.__mqUpdShown||typeof notify!=='function')return;window.__mqUpdShown=1;
  try{notify({title:'Nowa wersja gotowa',body:'Stuknij, żeby odświeżyć.',icon:'redo',cta:'Odśwież',run:()=>location.reload(),ms:12000})}catch(e){}}
// komunikat tylko gdy nowy worker ma inną wersję niż ta, która właśnie działa (przy przejściu ze starego workera strona bywa już nowa)
if('serviceWorker' in navigator){const SW=navigator.serviceWorker;
  SW.addEventListener('message',e=>{const v=e.data&&e.data.ver;if(HAD_SW&&v&&v!=='mq-'+VER){window.__mqUpd=1;updToast()}});
  SW.addEventListener('controllerchange',()=>{if(!HAD_SW)return;try{if(SW.controller)SW.controller.postMessage({q:'ver'})}catch(e){}})}

addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.__bip=e;const b=$('#lk-inst');if(b)b.hidden=false});
if('serviceWorker' in navigator)addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});

async function openPayload(k){
  let buf;
  try{const r=await fetch('app.bin?v='+VER,{cache:'no-cache'});if(!r.ok)throw new Error('http '+r.status);buf=new Uint8Array(await r.arrayBuffer())}
  catch(e){const x=new Error('net');x.net=true;throw x}
  const key=await crypto.subtle.importKey('raw',b64d(k),'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},key,buf.slice(12));
  const txt=await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(txt);
}
function launch(P){
  // ekran ładowania przykrywa wszystko, dopóki skrypt apki się nie wykona: bez mignięcia pustej skorupy
  const L=$('#mq-lock');if(L)L.style.cssText='position:fixed;inset:0;z-index:2147483000';
  const st=document.createElement('style');st.textContent=P.css;document.head.appendChild(st);
  document.body.insertAdjacentHTML('afterbegin',P.body);
  const done=()=>{if(L)L.remove();const x=document.getElementById('mq-ls');if(x)x.remove()};
  // skrypt apki z adresu blob: Chrome parsuje go w tle zamiast na głównym wątku (ok. 2,3 MB kodu i danych)
  let u=null;try{u=URL.createObjectURL(new Blob([P.js],{type:'text/javascript'}))}catch(e){}
  const s=document.createElement('script');
  if(u){s.src=u;s.onload=()=>{URL.revokeObjectURL(u);done()};
    s.onerror=()=>{URL.revokeObjectURL(u);const t=document.createElement('script');t.textContent=P.js;document.body.appendChild(t);done()}}
  else s.textContent=P.js;
  document.body.appendChild(s);if(!u)done();
  setTimeout(updToast,2500);
}
const errTxt=e=>{const c=e&&(e.code||e.message)||'';
  if(e&&e.net||/unavailable|network|offline|failed to fetch/i.test(c))return'Brak internetu. Połącz się i spróbuj jeszcze raz.';
  if(/permission/i.test(c))return'Ten kod został już użyty. Poproś o nowy.';
  return'Coś poszło nie tak. Spróbuj za chwilę.'};

async function claim(raw){
  const code=normCode(raw);
  if(code.length!==20){const x=new Error('len');x.msg='Kod ma 20 znaków. Sprawdź, czy przepisałeś całość.';throw x}
  const inv=await hash(code);
  await fbWait();
  const uid=await MQFB.ready();
  const d=await MQFB.get('invites/'+inv);
  if(!d.exists){const x=new Error('nocode');x.msg='Nie ma takiego kodu. Sprawdź, czy nie ma literówki.';throw x}
  const v=d.data,uids=Array.isArray(v.uids)?v.uids:[];
  if(!uids.includes(uid)){
    if((v.n||0)>=(v.max||1)){const x=new Error('used');x.msg='Ten kod został już użyty. Poproś o nowy.';throw x}
    await MQFB.update('invites/'+inv,{n:(v.n||0)+1,uids:uids.concat([uid])});
  }
  await MQFB.set('members/'+uid,{p:v.p,inv,at:Date.now()});
  const kd=await MQFB.get('keys/app');
  if(!kd.exists||!kd.data.k){const x=new Error('nokey');x.msg='Apka nie jest jeszcze skonfigurowana.';throw x}
  ls('mq:k',kd.data.k);ls('mq:p',v.p);ls('mq:inv',inv);
  if(kd.data.ap&&kd.data.ap===v.p){try{const a=await MQFB.get('admins/'+uid);if(!a.exists)await MQFB.set('admins/'+uid,{at:Date.now()});ls('mq:admin','1')}catch(e){}}
  return kd.data.k;
}

const logo='<img class="lk-logo" src="icons/icon-192.png" alt="">';
function screen(html){$('#mq-lock').innerHTML=`<div class="lk">${html}</div>`}

function showLock(msg){
  if(isIOS()&&!isStandalone()){
    screen(`${logo}<h1>matoorqa</h1><p class="sub">Beta tylko na zaproszenie.</p>
     <div class="lk-card">${inApp()?'<b>Otwórz ten link w Safari.</b><span>W tej aplikacji nie da się dodać matoorqa do ekranu głównego.</span>':`<b>Najpierw dodaj apkę do ekranu głównego</b><ol><li>Stuknij <b>Udostępnij</b> (kwadrat ze strzałką).</li><li>Wybierz <b>„Do ekranu początkowego”</b> i potwierdź.</li><li>Otwórz matoorqa z ikonki i dopiero tam wpisz kod.</li></ol>`}</div>
     <p class="lk-note">Kod działa tylko raz. Jak wpiszesz go tutaj w przeglądarce, apka z ikonki już go nie przyjmie.</p>`);
    return}
  screen(`${logo}<h1>matoorqa</h1><p class="sub">Beta tylko na zaproszenie.</p>
   <form id="lk-f" autocomplete="off"><label for="lk-in">Kod zaproszenia</label>
    <input id="lk-in" inputmode="text" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="29" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX" aria-describedby="lk-m"></form>
   <button class="lk-btn" id="lk-go" form="lk-f" type="submit">Wejdź</button>
   <div class="lk-msg" id="lk-m" role="status">${msg?esc(msg):''}</div>
   <p class="lk-note">Kod działa raz, na jednym urządzeniu. Po wejściu apka pamięta cię na tym telefonie.</p>
   <button class="lk-btn ghost" id="lk-inst" type="button"${window.__bip?'':' hidden'}>Zainstaluj na telefonie</button>`);
  const inp=$('#lk-in');
  inp.addEventListener('input',()=>{const p=prettyCode(inp.value).slice(0,24);if(p!==inp.value)inp.value=p;$('#lk-m').textContent=''});
  $('#lk-inst').addEventListener('click',async()=>{const e=window.__bip;if(!e)return;e.prompt();try{await e.userChoice}catch(x){}window.__bip=null;$('#lk-inst').hidden=true});
  $('#lk-f').addEventListener('submit',async ev=>{ev.preventDefault();const b=$('#lk-go'),m=$('#lk-m');b.disabled=true;b.textContent='Sprawdzam…';m.textContent='';
    try{const k=await claim(inp.value);b.textContent='Otwieram…';const P=await openPayload(k);launch(P)}
    catch(e){m.className='lk-msg';m.textContent=e.msg||errTxt(e);b.disabled=false;b.textContent='Wejdź'}});
  setTimeout(()=>{try{inp.focus()}catch(e){}},60);
}

async function showSetup(k){
  screen(`${logo}<h1>Konfiguracja</h1><p class="sub">Ten link jest tylko dla ciebie. Nie wysyłaj go nikomu.</p>
   <div class="lk-card"><span>Zrobię klucz, <b>10 kodów dla znajomych</b> i twoje konto admina na tym urządzeniu.</span></div>
   <button class="lk-btn" id="lk-s">Uruchom konfigurację</button><div class="lk-msg" id="lk-m" role="status"></div>`);
  $('#lk-s').addEventListener('click',async()=>{const b=$('#lk-s'),m=$('#lk-m');b.disabled=true;b.textContent='Konfiguruję…';m.textContent='';
    try{
      try{await openPayload(k)}catch(e){if(e.net)throw e;const x=new Error('key');x.msg='Ten link jest uszkodzony. Skopiuj go jeszcze raz w całości.';throw x}
      await fbWait();
      const uid=await MQFB.ready();
      const kd=await MQFB.get('keys/app').catch(()=>({exists:false,denied:true}));
      if(kd.exists){const x=new Error('done');x.msg='Konfiguracja była już zrobiona. Kody znajdziesz w Profilu, w sekcji Zaproszenia, na urządzeniu, na którym ją robiłeś.';throw x}
      await MQFB.set('admins/'+uid,{at:Date.now()});
      const codes=[];
      for(let i=0;i<11;i++){const c=newCode(),inv=await hash(c),p=newPid(),label=i?'Znajomy '+i:'Ty';codes.push({code:c,inv,p,label})}
      await MQFB.set('keys/app',{k,ap:codes[0].p,at:Date.now()});
      for(let i=0;i<codes.length;i++){const c=codes[i];
        await MQFB.set('invites/'+c.inv,{p:c.p,label:c.label,n:0,max:1,uids:[],at:Date.now()+i});
        await MQFB.set('codes/'+c.inv,{code:c.code,p:c.p,label:c.label,at:Date.now()+i})}
      await claim(codes[0].code);
      ls('mq:admin','1');ls('mq:codes',JSON.stringify(codes));
      history.replaceState(null,'',location.pathname+location.search);
      showCodes(codes.slice(1));
    }catch(e){m.className='lk-msg';m.textContent=e.msg||(/permission/i.test(e&&(e.code||e.message)||'')?'Baza jest już zablokowana regułami. Konfigurację trzeba zrobić przed wklejeniem reguł.':errTxt(e));b.disabled=false;b.textContent='Spróbuj jeszcze raz'}
  });
}
function showCodes(codes){
  const all=codes.map(c=>`${c.label}: ${c.code}`).join('\n');
  screen(`${logo}<h1>Gotowe</h1><p class="sub">Kody dla znajomych. Każdy działa raz.</p>
   <div class="lk-codes">${codes.map((c,i)=>`<div class="lk-code"><span><small>${esc(c.label)}</small>${esc(c.code)}</span><button type="button" data-i="${i}">Kopiuj</button></div>`).join('')}</div>
   <button class="lk-btn ghost" id="lk-all" type="button">Kopiuj wszystkie</button>
   <p class="lk-note">Kody zobaczysz też w apce: Profil, sekcja Zaproszenia. Teraz wklej reguły w Firebase, tak jak w instrukcji.</p>
   <button class="lk-btn" id="lk-open" type="button">Otwórz apkę</button>`);
  document.querySelectorAll('.lk-code button').forEach(b=>b.addEventListener('click',async()=>{const ok=await copy(codes[+b.dataset.i].code);b.textContent=ok?'Skopiowane':'Zaznacz ręcznie'}));
  $('#lk-all').addEventListener('click',async()=>{const ok=await copy(all);$('#lk-all').textContent=ok?'Skopiowane':'Zaznacz kody ręcznie'});
  $('#lk-open').addEventListener('click',async()=>{const b=$('#lk-open');b.disabled=true;b.textContent='Otwieram…';try{launch(await openPayload(ls('mq:k')))}catch(e){b.disabled=false;b.textContent='Otwórz apkę'}});
}

async function start(){
  const h=location.hash;
  if(h.startsWith('#setup=')){const k=decodeURIComponent(h.slice(7));if(ls('mq:k')===k&&ls('mq:admin')==='1'){history.replaceState(null,'',location.pathname+location.search)}else{showSetup(k);return}}
  const k=ls('mq:k');
  if(k){warmFonts();
    try{launch(await openPayload(k));return}
    catch(e){
      if(e.net){screen(`${logo}<h1>matoorqa</h1><p class="sub">Brak internetu, a apka nie jest jeszcze zapisana na tym urządzeniu.</p><button class="lk-btn" onclick="location.reload()">Spróbuj jeszcze raz</button>`);return}
      ls('mq:k',null);
    }
  }
  if(window.__fbL)window.__fbL();
  showLock();
}
start();
})();

</script>
</body>
</html>
